services:
  # ---------------------------------------------------
  # 📊 Standalone Arize Phoenix Server
  # ---------------------------------------------------
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix_server
    ports:
      - "6006:6006"
    networks:
      - ai_agent_network
    restart: unless-stopped

  # ---------------------------------------------------
  # ⚡ FastAPI Backend
  # ---------------------------------------------------
  
   # ---------------------------------------------------
  # ⚡ FastAPI Backend
  # ---------------------------------------------------
  ai_agent_backend:
    build: .
    container_name: ai_agent_backend
    init: true
    command: ["uvicorn", "app.fastapi_app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HUGGINGFACEHUB_API_TOKEN=${HUGGINGFACEHUB_API_TOKEN}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
      - CHROMA_PATH=/app/chroma_db
    volumes:
      - .:/app
      - ./chroma_db:/app/chroma_db
    depends_on:
      - phoenix
    networks:
      - ai_agent_network
    restart: unless-stopped

  # ---------------------------------------------------
  # 🖥️ Streamlit Frontend
  # ---------------------------------------------------
  ai_agent_frontend:
    build: .
    container_name: ai_agent_frontend
    command: streamlit run app/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://ai_agent_backend:8000
    volumes:
      - .:/app
    depends_on:
      - ai_agent_backend
    networks:
      - ai_agent_network
    restart: unless-stopped

# ---------------------------------------------------
# 🌐 Isolated Bridge Network
# ---------------------------------------------------
networks:
  ai_agent_network:
    driver: bridge