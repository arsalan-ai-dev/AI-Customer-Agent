version: '3.8'

services:
  # -------------------------------------------------------------
  # FastAPI Backend Service
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_agent_backend
    command: uvicorn fastapi_app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./data:/app/data              # Persist ChromaDB vector store
      - ./uploads:/app/uploads        # Persist uploaded documents
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always

  # -------------------------------------------------------------
  # Streamlit Frontend Service
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_agent_frontend
    command: streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000/api/v1  # Points directly to container service name
    depends_on:
      backend:
        condition: service_healthy              # Waits for backend health check to pass
    restart: always

networks:
  default:
    name: ai_agent_network